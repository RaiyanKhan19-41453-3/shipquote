name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship
          POSTGRES_DB: shipquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test everything, including the database test
        env:
          DATABASE_URL: postgres://ship:ship@localhost:5432/shipquote?sslmode=disable
        run: go test ./... -count=1
