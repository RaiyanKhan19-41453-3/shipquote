services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: ship
      POSTGRES_DB: shipquote
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship -d shipquote"]
      interval: 3s
      timeout: 2s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Containers talk to each other on container ports: the api always
      # reaches Postgres at db:5432. DB_PORT only changes YOUR machine's
      # door (5433), never this address.
      DATABASE_URL: postgres://ship:ship@db:5432/shipquote?sslmode=disable
      PORT: ${PORT:-8080}
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
